name: Appli Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires et compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: spectro-apk
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-tests
          path: android/app/build/reports/tests/
      - name: Publier l'APK (branche main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk spectro.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest spectro.apk --prerelease \
            --title "Appli Android (dernière version)" \
            --notes "APK compilé automatiquement depuis main (${GITHUB_SHA::7}). Ouvrir ce fichier sur le téléphone pour l'installer."
